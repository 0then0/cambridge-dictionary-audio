name: Mobile formatting

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Format (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, language: kotlin }
          - { os: macos-26, language: swift }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.13.1'
          python-version: '3.15'
      - uses: actions/setup-java@v5
        if: matrix.language == 'kotlin'
        with:
          distribution: temurin
          java-version: '17'
      - name: Select pinned Swift build toolchain
        if: matrix.language == 'swift'
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_26.4.1.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Cache pinned formatters
        uses: actions/cache@v6.1.0
        with:
          path: build/format-tools
          key: mobile-format-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mobile/formatters.json', 'mobile/swift-format.resolved', 'scripts/format_mobile.py', '.github/workflows/mobile-format.yml') }}
      - name: Check source formatting without writes
        run: uv run --no-project python scripts/format_mobile.py check --language ${{ matrix.language }}
      - name: Verify generated Anki contract separately
        if: matrix.language == 'kotlin'
        run: uv run --no-project python scripts/mobile_contracts.py --check
