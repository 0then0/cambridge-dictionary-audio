name: Checks

on: [push, pull_request]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - {os: macos-latest, python: "3.10"}
          - {os: macos-latest, python: "3.15"}
          - {os: windows-latest, python: "3.10"}
          - {os: windows-latest, python: "3.15"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest

  gui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.15"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python }}
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libpulse0 libxkbcommon0
      - run: uv sync --locked --group gui
      - run: uv run --locked --group gui pytest tests/test_gui.py tests/test_theme.py tests/test_library.py
      - name: Diagnose combined Linux Python 3.10 runtime
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.10'
        env:
          PYTHONMALLOC: debug
          PYTHONFAULTHANDLER: "1"
        run: |
          uv run --locked --group gui python - <<'PYTHON'
          import subprocess
          import sys
          from pathlib import Path

          code = """
          from concurrent.futures import ThreadPoolExecutor
          from cambridge_audio import gui
          import pytest, sys
          print('EMPTY_TUPLE_BEFORE', hex(id(())), sys.getrefcount(()), flush=True)
          result = pytest.main(sys.argv[1:])
          print('EMPTY_TUPLE_AFTER', hex(id(())), sys.getrefcount(()), flush=True)
          raise SystemExit(result)
          """
          import textwrap
          code = textwrap.dedent(code)
          failed = []
          for path in sorted(Path('tests').glob('test_*.py')):
              if path.name in {'test_gui.py', 'test_theme.py'}:
                  continue
              print('QT_PRELOADED_FILE', path, flush=True)
              result = subprocess.run([sys.executable, '-c', code, str(path), '-q'])
              print('QT_PRELOADED_RESULT', path, result.returncode, flush=True)
              if result.returncode:
                  failed.append(str(path))
          if not failed:
              for name in ('test_cli.py', 'test_terminal.py'):
                  print('GUI_COMBINED_FILE', name, flush=True)
                  result = subprocess.run([
                      sys.executable, '-c', code, 'tests/test_gui.py', 'tests/' + name, '-q'
                  ])
                  print('GUI_COMBINED_RESULT', name, result.returncode, flush=True)
                  if result.returncode:
                      failed.append(name)
          print('FAILED_COMBINATIONS', failed, flush=True)
          raise SystemExit(bool(failed))
          PYTHON

  extension:
    name: Browser extension (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run package
      - name: Validate Firefox manifest and code
        if: runner.os == 'Linux'
        env:
          NO_UPDATE_NOTIFIER: "1"
        run: npm exec --yes --package web-ext@10.7.0 -- web-ext lint --source-dir dist/firefox --warnings-as-errors
      - uses: actions/upload-artifact@v7.0.2
        if: runner.os == 'Linux'
        with:
          name: browser-extensions
          path: extension/dist/*.zip
          if-no-files-found: error
