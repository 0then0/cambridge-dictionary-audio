name: Checks

on: [push, pull_request]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - {os: macos-latest, python: "3.10"}
          - {os: macos-latest, python: "3.15"}
          - {os: windows-latest, python: "3.10"}
          - {os: windows-latest, python: "3.15"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest

  gui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.15"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python }}
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libpulse0 libxkbcommon0
      - run: uv sync --locked --group gui
      - run: uv run --locked --group gui pytest tests/test_gui.py tests/test_theme.py tests/test_library.py
      - name: Diagnose combined Linux Python 3.10 runtime
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.10'
        env:
          PYTHONMALLOC: debug
          PYTHONFAULTHANDLER: "1"
        run: |
          uv run --locked --group gui python - <<'PYTHON'
          import os
          import re
          import subprocess
          import sys
          import textwrap

          bootstrap = """
          import os, sys
          executable = os.path.realpath(sys.executable)
          for line in open('/proc/self/maps'):
              fields = line.split()
              if len(fields) >= 6 and fields[-1] == executable and fields[2] == '00000000':
                  print('PYTHON_IMAGE_BASE', fields[0].split('-')[0], flush=True)
          """
          bootstrap = textwrap.dedent(bootstrap)
          cases = {
              'application-before-terminal': 'from cambridge_audio.gui import create_application; app=create_application([]); from cambridge_audio import terminal; app.shutdown()',
              'terminal-before-application': 'from cambridge_audio import terminal; from cambridge_audio.gui import create_application; app=create_application([]); app.shutdown()',
              'bare-application': 'from PySide6.QtWidgets import QApplication; app=QApplication([]); from cambridge_audio import terminal; app.shutdown()',
              'bare-terminal-first': 'from cambridge_audio import terminal; from PySide6.QtWidgets import QApplication; app=QApplication([]); app.shutdown()',
              'icon-and-cli': "import pytest; raise SystemExit(pytest.main(['tests/test_gui.py::test_application_has_a_renderable_icon_and_display_name', 'tests/test_cli.py', '-q']))",
              'gui-and-cli': "import pytest; raise SystemExit(pytest.main(['tests/test_gui.py', 'tests/test_cli.py', '-q']))",
          }
          failed = []
          symbols = subprocess.check_output(['nm', '-an', os.path.realpath(sys.executable)], text=True)
          for name, code in cases.items():
              print('MINIMAL_CASE', name, flush=True)
              result = subprocess.run([sys.executable, '-c', bootstrap + code],
                                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                      text=True, errors='replace')
              print(result.stdout, flush=True)
              print('MINIMAL_RESULT', name, result.returncode, flush=True)
              if result.returncode:
                  failed.append(name)
                  base = re.search(r'PYTHON_IMAGE_BASE ([0-9a-f]+)', result.stdout)
                  pointer = re.search(r'Debug memory block at address p=(0x[0-9a-f]+)', result.stdout)
                  if base and pointer:
                      offset = int(pointer[1], 16) - int(base[1], 16)
                      candidates = []
                      for line in symbols.splitlines():
                          fields = line.split()
                          if len(fields) >= 3 and re.fullmatch('[0-9a-f]+', fields[0]):
                              address = int(fields[0], 16)
                              if address <= offset:
                                  candidates.append((address, fields[-1]))
                      print('BAD_POINTER_OFFSET', hex(offset), 'NEAREST_SYMBOLS', sorted(candidates)[-5:], flush=True)
          print('FAILED_CASES', failed, flush=True)
          raise SystemExit(bool(failed))
          PYTHON

  extension:
    name: Browser extension (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run package
      - name: Validate Firefox manifest and code
        if: runner.os == 'Linux'
        env:
          NO_UPDATE_NOTIFIER: "1"
        run: npm exec --yes --package web-ext@10.7.0 -- web-ext lint --source-dir dist/firefox --warnings-as-errors
      - uses: actions/upload-artifact@v7.0.2
        if: runner.os == 'Linux'
        with:
          name: browser-extensions
          path: extension/dist/*.zip
          if-no-files-found: error
