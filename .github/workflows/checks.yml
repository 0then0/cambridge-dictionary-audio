name: Checks

on: [push, pull_request]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - {os: macos-latest, python: "3.10"}
          - {os: macos-latest, python: "3.15"}
          - {os: windows-latest, python: "3.10"}
          - {os: windows-latest, python: "3.15"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Verify PyYAML source installation without its C extension
        if: runner.os == 'Windows' && matrix.python == '3.15'
        run: |
          uv sync --locked --no-binary-package pyyaml --reinstall-package pyyaml
          uv run --locked python -c "import yaml; assert not yaml.__with_libyaml__"
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - name: Verify the CLI environment does not require Qt
        run: uv run --locked python -c "import importlib.util; assert importlib.util.find_spec('PySide6') is None"
      - run: uv run --locked pytest

  gui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.15"]
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python }}
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libpulse0 libxkbcommon0
      - run: uv sync --locked --group gui
      - run: uv run --locked --group gui pytest

  extension:
    name: Browser extension (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run package
      - name: Validate Firefox manifest and code
        if: runner.os == 'Linux'
        env:
          NO_UPDATE_NOTIFIER: "1"
        run: npm exec --yes --package web-ext@10.7.0 -- web-ext lint --source-dir dist/firefox --warnings-as-errors
      - uses: actions/upload-artifact@v7.0.2
        if: runner.os == 'Linux'
        with:
          name: browser-extensions
          path: extension/dist/*.zip
          if-no-files-found: error
