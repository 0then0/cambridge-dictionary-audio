name: Checks

on: [push, pull_request]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - {os: macos-latest, python: "3.10"}
          - {os: macos-latest, python: "3.15"}
          - {os: windows-latest, python: "3.10"}
          - {os: windows-latest, python: "3.15"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest

  gui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.15"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python }}
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libpulse0 libxkbcommon0
      - run: uv sync --locked --group gui
      - run: uv run --locked --group gui pytest tests/test_gui.py tests/test_theme.py tests/test_library.py
      - name: Diagnose combined Linux Python 3.10 runtime
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.10'
        env:
          PYTHONMALLOC: debug
          PYTHONFAULTHANDLER: "1"
        run: |
          uv run --locked --group gui python - <<'PYTHON'
          import subprocess, sys
          cases = {
              'settings-bool': "from PySide6.QtCore import QSettings; s=QSettings('/tmp/boolean.ini', QSettings.Format.IniFormat); s.setValue('value',True); f=lambda:s.value('value',False,type=bool)",
              'settings-default': "from PySide6.QtCore import QSettings; s=QSettings('/tmp/default.ini', QSettings.Format.IniFormat); f=lambda:s.value('missing',True,type=bool)",
              'window': "from cambridge_audio.gui import create_application, MainWindow; from PySide6.QtCore import QEvent, QSettings; app=create_application([]); s=QSettings('/tmp/window.ini',QSettings.Format.IniFormat); s.setValue('output_dir','/tmp/audio'); exec('def f():\n w=MainWindow(s); w.show(); app.processEvents(); w.close(); w.deleteLater(); app.sendPostedEvents(None,QEvent.Type.DeferredDelete); app.processEvents()')",
              'bare-widget': "from PySide6.QtWidgets import QApplication,QWidget; from PySide6.QtCore import QEvent; app=QApplication([]); exec('def f():\n w=QWidget(); w.show(); app.processEvents(); w.close(); w.deleteLater(); app.sendPostedEvents(None,QEvent.Type.DeferredDelete); app.processEvents()')",
          }
          for name, setup in cases.items():
              code = "import sys,gc; " + setup + "; f(); gc.collect(); before=sys.getrefcount(True); [f() for _ in range(100)]; gc.collect(); print('TRUE_DELTA', sys.getrefcount(True)-before,flush=True)"
              print('CASE',name,flush=True)
              result = subprocess.run([sys.executable,'-c',code])
              print('RESULT',name,result.returncode,flush=True)
          PYTHON

  extension:
    name: Browser extension (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run package
      - name: Validate Firefox manifest and code
        if: runner.os == 'Linux'
        env:
          NO_UPDATE_NOTIFIER: "1"
        run: npm exec --yes --package web-ext@10.7.0 -- web-ext lint --source-dir dist/firefox --warnings-as-errors
      - uses: actions/upload-artifact@v7.0.2
        if: runner.os == 'Linux'
        with:
          name: browser-extensions
          path: extension/dist/*.zip
          if-no-files-found: error
