name: Mobile checks and artifacts

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  format:
    uses: ./.github/workflows/mobile-format.yml

  android:
    needs: format
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.13.1'
      - run: sudo apt-get update && sudo apt-get install -y pkgconf
      - name: Pinned native toolchains
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build MP3 library from verified sources
        run: |
          python3 scripts/build_mobile_codec.py android-arm64-v8a
          python3 scripts/build_mobile_codec.py android-armeabi-v7a
          python3 scripts/build_mobile_codec.py android-x86_64
      - name: Shared core, Android build, lint and unit tests
        working-directory: mobile
        run: ./gradlew :shared:jvmTest :androidApp:assembleDebug :androidApp:assembleRelease :androidApp:lintDebug :androidApp:testDebugUnitTest
      - name: Emulator integration and native audio pipeline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: cd mobile && ./gradlew :androidApp:connectedDebugAndroidTest
      - run: python3 scripts/package_mobile.py android --output dist/mobile
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: mobile-android-distributions
          path: |
            dist/mobile/*
          if-no-files-found: error

  ios:
    needs: format
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: brew install pkgconf
      - name: Build and test native iPhone application
        working-directory: mobile/iosApp
        run: >-
          xcodebuild -project CambridgeAudio.xcodeproj -scheme CambridgeAudio
          -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 17'
          -derivedDataPath ../../build/ios-simulator
          -resultBundlePath ../../build/ios-tests.xcresult
          CODE_SIGNING_ALLOWED=NO test
      - name: Build unsigned device application
        working-directory: mobile/iosApp
        run: >-
          xcodebuild -project CambridgeAudio.xcodeproj -scheme CambridgeAudio
          -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath ../../build/ios-device CODE_SIGNING_ALLOWED=NO build
      - run: python3 scripts/package_mobile.py ios --output dist/mobile
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: mobile-ios-distributions
          path: |
            dist/mobile/*
          if-no-files-found: error
